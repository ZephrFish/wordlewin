name: Daily Wordle Word

on:
  schedule:
    - cron: "15 0 * * *" # 00:15 UTC daily
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD), defaults to today (UTC)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update README
        env:
          TARGET_DATE: ${{ github.event.inputs.date }}
        run: python3 update_readme.py $TARGET_DATE

      - name: Build Pages site
        env:
          TARGET_DATE: ${{ github.event.inputs.date }}
        run: python3 build_site.py $TARGET_DATE

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily Wordle word: $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
