name: Daily Wordle Word

on:
  schedule:
    - cron: "15 0 * * *" # 00:15 UTC daily
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD), defaults to today (UTC)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Update README
        env:
          TARGET_DATE: ${{ github.event.inputs.date }}
        run: python3 update_readme.py $TARGET_DATE

      - name: Build Pages site
        env:
          TARGET_DATE: ${{ github.event.inputs.date }}
        run: python3 build_site.py $TARGET_DATE

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/words.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily Wordle word: $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  notify-failure:
    needs: [update, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily Wordle run failed"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again on $(date -u +%F): $RUN_URL"
          else
            gh issue create --title "$title" --body "The daily run failed on $(date -u +%F): $RUN_URL

          The README and Pages site were not updated. Close this issue once it's fixed."
          fi
